shell=/run/current-system/sw/bin/zsh -l

font=JetBrainsMono NerdFont:size=16:style=Regular
font-bold=JetBrainsMono NerdFont:size=16:style=Bold
font-italic=JetBrainsMono NerdFont:size=16:style=Italic
font-bold-italic=JetBrainsMono NerdFont:size=16:style=Bold Italic

pad=0x0 center
selection-target=clipboard

[colors-dark]
background=000000
alpha=0.9

[key-bindings]
clipboard-paste=Control+v
fullscreen=F11
